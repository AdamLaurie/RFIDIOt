# Prevent the in-kernel NFC stack from claiming PN53x USB readers so that
# libnfc (and RFIDIOt via pynfc) can access them. Without this, pn533_usb
# binds the device on plug-in and libnfc fails with:
#   "Unable to set USB configuration (Operation not permitted)"
#
# Install:
#   sudo cp linux/blacklist-libnfc.conf /etc/modprobe.d/
#   sudo modprobe -r pn533_usb pn533 nfc   # unload if currently loaded
#   (blacklist prevents them from auto-loading again on plug-in / reboot)
#
# This disables the in-kernel NFC subsystem system-wide. Remove the file to
# restore it. (No initramfs rebuild needed - these are not early-boot modules.)

blacklist pn533_usb
blacklist pn533
blacklist nfc
